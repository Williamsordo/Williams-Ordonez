name: Build C Programs

on:
  push:
    branches: [ main, master, Algoritmos-y-programacion ]
  pull_request:
    branches: [ main, master, Algoritmos-y-programacion ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile All C Programs
        run: |
          echo "Compiling all C files recursively..."
          find . -name "*.c" | while read -r file; do
            echo "Building $file..."
            gcc -Wall -Wextra -std=c99 "$file" -o "${file%.c}.out" || exit 1
          done
          echo "All C programs compiled successfully!"
